[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval_kit"]

[project]
name = "rag-eval-kit"
version = "0.1.0"
description = "Automated evaluation for retrieval-augmented generation pipelines"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12,<0.13",
    "click>=8.1,<8.3",
    "rich>=13.7,<14.0",
    "openai>=1.30,<2.0",
    "anthropic>=0.28,<1.0",
    "chromadb>=0.5,<0.6",
    "pypdf>=4.2,<5.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
rag-eval = "rag_eval_kit.cli:app"
